name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_metadata:
    name: Inspect release metadata
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.release_metadata.outputs.version }}
      should_publish: ${{ steps.release_metadata.outputs.should_publish }}

    steps:
      - name: Check out revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect version change
        id: release_metadata
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              should_publish = True
          else:
              previous_text = subprocess.run(
                  ["git", "show", f"{os.environ['BEFORE_SHA']}:pyproject.toml"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              previous_version = tomllib.loads(previous_text)["project"]["version"]
              should_publish = version != previous_version
              if not should_publish:
                  print(
                      f"pyproject.toml changed without changing project.version "
                      f"({version}); skipping publication"
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"should_publish={str(should_publish).lower()}", file=output)
          PY

  build:
    name: Build distributions
    needs: release_metadata
    if: needs.release_metadata.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: [release_metadata, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openclatura/${{ needs.release_metadata.outputs.package_version }}/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
