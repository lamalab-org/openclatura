name: CI

on:
  push:
    branches: [main,tests]
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.15.15"
      - name: Ruff check
        run: ruff check src/openclatura tests
      - name: Ruff format check
        run: ruff format --check src/openclatura tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up JDK (for OPSIN)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast tests
        run: |
          pytest -m "not slow and not dataset and not golden" \
                 --maxfail=20 \
                 --durations=20

  rdkit-compat:
    # Strict golden-output regression across RDKit versions. Detects
    # naming output that drifts with the RDKit upgrade cycle (aromaticity,
    # kekulisation, H-count perception). Each matrix row pins a specific
    # rdkit and runs only the `golden` test.
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        rdkit-version:
          - "2024.03.6"
          - "2024.09.6"
          - "2025.03.6"
          - "2025.09.5"
          - "2026.3.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + pinned rdkit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --force-reinstall --no-deps "rdkit==${{ matrix.rdkit-version }}"

      - name: Show installed versions
        run: |
          python -c "import rdkit, sys; print('python', sys.version); print('rdkit', rdkit.__version__)"

      - name: Run golden corpus test
        run: pytest -m golden -v --no-header -rA

  single-thread-performance:
    if: github.event_name == 'pull_request' && github.base_ref == 'tests'
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Check out target revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: head/pyproject.toml

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e head

      - name: Compare PR single-thread performance with target
        run: |
          python head/benchmarks/single_thread_benchmark.py \
            --base-src base/src \
            --head-src head/src \
            --corpus head/benchmarks/data/opsin_verified_5000.csv \
            --repetitions 3 \
            --threshold-percent 15 \
            --minimum-absolute-seconds 1 \
            --report performance-report.json

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-thread-performance
          path: performance-report.json
          if-no-files-found: warn

  docker:
    needs: [lint, test, rdkit-compat]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    secrets: inherit
  paper-evaluations:
    if: github.event_name == 'pull_request' && github.base_ref == 'tests'
    needs: [lint, test, rdkit-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - qm9/qm9_all
          - pubchem/pubchem_seed5_100000
          - pubchem/pubchem_seed17_100000
          - pubchem/pubchem_seed42_100000
          - pubchem/pubchem_seed63_100000
          - pubchem/pubchem_seed87_100000
          - zinc22/zinc22_seed5_100000
          - zinc22/zinc22_seed17_100000
          - zinc22/zinc22_seed42_100000
          - zinc22/zinc22_seed63_100000
          - zinc22/zinc22_seed87_100000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up JDK for changed-name OPSIN checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OpenClatura and regression dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compare against the paper evaluation
        run: |
          python evaluations/check_regression.py \
            "evaluations/results/${{ matrix.shard }}_openclatura.jsonl" \
            --processes auto \
            --report "regression-reports/${{ strategy.job-index }}.json"

      - name: Upload discrepancy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-regression-${{ strategy.job-index }}
          path: regression-reports/*.json
          if-no-files-found: error
